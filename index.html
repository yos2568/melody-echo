<html lang="th">
  <head>

    <meta name="color-scheme" content="light dark" />

    <meta name="theme-color" content="#0f1a21" media="(prefers-color-scheme: dark)" />

    <meta

    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <style>
      /* สีหลัก */
      :root {
        --bg: #dfe9ef; /* พื้นหลังของหน้า */
        --surface: #ffffff; /* พื้นการ์ด */
        --surface-2: #f3f8fa; /* พื้นช่องใส่ข้อมูลและปุ่มรอง */
        --line: #c6d6e0; /* เส้นขอบ */
        --line-strong: #b5c8d4; /* เส้นหนัก เช่น เส้นบรรทัดห้าเส้น */
        --text: #17252f; /* ตัวอักษรหลัก */
        --text-soft: #33454f; /* ตัวอักษรรอง */
        --muted: #5f7584; /* คำอธิบายเล็ก (ใช้บนพื้นการ์ดเท่านั้น) */
        --action: #c4421f; /* ปุ่มหลักและจุดเน้น */
        --action-ink: #ffffff; /* ตัวอักษรบนปุ่มหลัก */
        --action-soft: #fdece7; /* พื้นเน้นอ่อน */
        --blue: #3f6f8d; /* สีรอง และวงโฟกัส */
        --blue-soft: #e3eef5; /* พื้นข้อมูลอ่อน */
        --brass: #9a6a1f; /* สีที่สาม ใช้กับเหรียญ */
        --good: #2e7d59; /* ถูก */
        --good-soft: #e1f2ea; /* พื้นเมื่อถูก */
        --warn: #9a6a1f; /* ใกล้ถูก หรือควรระวัง */
        --bad: #b3261e; /* ผิด */
        --bad-soft: #fbe6e4; /* พื้นเมื่อผิด */
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1a21;
          --surface: #172630;
          --surface-2: #1c2f3b;
          --line: #2c4150;
          --line-strong: #3a5263;
          --text: #e6eef3;
          --text-soft: #c3d3dc;
          --muted: #8ea3b1;
          --action: #f07a5a;
          --action-ink: #1b0e09;
          --action-soft: #3a221b;
          --blue: #8cb8d3;
          --blue-soft: #1d3442;
          --brass: #d9a94f;
          --good: #7fd1a6;
          --good-soft: #1b3a2e;
          --warn: #e3b04b;
          --bad: #ff8a80;
          --bad-soft: #4a2220;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1a21;
        --surface: #172630;
        --surface-2: #1c2f3b;
        --line: #2c4150;
        --line-strong: #3a5263;
        --text: #e6eef3;
        --text-soft: #c3d3dc;
        --muted: #8ea3b1;
        --action: #f07a5a;
        --action-ink: #1b0e09;
        --action-soft: #3a221b;
        --blue: #8cb8d3;
        --blue-soft: #1d3442;
        --brass: #d9a94f;
        --good: #7fd1a6;
        --good-soft: #1b3a2e;
        --warn: #e3b04b;
        --bad: #ff8a80;
        --bad-soft: #4a2220;
        color-scheme: dark;
      }
      /* ขนาดและระยะ */
      :root {
        --space-1: 4px; /* ระยะห่างเล็กที่สุด */
        --space-2: 8px; /* ระยะห่างเล็ก */
        --space-3: 12px; /* ระยะห่างกลาง */
        --space-4: 16px; /* ระยะห่างมาตรฐานและขอบหน้า */
        --space-5: 24px; /* ระยะห่างใหญ่ */
        --space-6: 32px; /* ระยะห่างใหญ่มาก */
        --radius-control: 12px; /* มุมปุ่มและช่องกรอก */
        --radius-card: 18px; /* มุมการ์ด */
        --radius-pill: 999px; /* มุมแบบแคปซูล */
        --page-width: 592px; /* ความกว้างสูงสุดของหน้า รวมขอบ */
        --target-min: 44px; /* ขนาดต่ำสุดของปุ่มที่ต้องแตะ */
        --button-main: 52px; /* ความสูงปุ่มหลัก */
        --text-small: 14.4px; /* ตัวอักษรเล็ก */
        --text-base: 16px; /* ตัวอักษรปกติ */
        --text-medium: 18px; /* ตัวอักษรหัวข้อย่อย */
        --text-large: 22px; /* ตัวอักษรตัวเลข */
        --text-title: 28px; /* ตัวอักษรหัวเรื่อง */
        --medal-size: 32px; /* ขนาดเหรียญ */
        --pop-distance: 12px; /* ระยะที่คะแนนลอยขึ้น */
        --pop-duration: 200ms; /* เวลาที่คะแนนลอย */
        --fade-duration: 200ms; /* เวลาเปลี่ยนสถานะของปุ่มและช่อง */
        --result-step: 80ms; /* ระยะหน่วงของแต่ละบรรทัดในหน้าสรุป */
        --font-main: 'Sarabun', 'Leelawadee UI', 'Noto Sans Thai', Thonburi, Tahoma, system-ui, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: var(--text-base) / 1.6 var(--font-main);
      }
      main {
        max-width: var(--page-width);
        margin: 0 auto;
        padding: var(--space-5) var(--space-4);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: var(--text-title);
        line-height: 1.4;
        text-wrap: balance;
      }
      h2 {
        font-size: var(--text-medium);
        margin: var(--space-4) 0 var(--space-2);
        text-wrap: balance;
      }
      h3 {
        font-size: var(--text-base);
        margin: var(--space-3) 0 var(--space-1);
      }
      h1:focus {
        outline: none;
      }
      button,
      select {
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        min-height: var(--target-min);
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      [role='button']:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }
      button:disabled,
      button[aria-disabled='true'] {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--action);
        color: var(--action-ink);
        border-color: var(--action);
        min-height: var(--button-main);
        font-weight: 700;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin: var(--space-4) 0;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: var(--space-4);
        margin-top: var(--space-4);
      }
      .soft {
        color: var(--text-soft);
      }
      .small {
        font-size: var(--text-small);
      }
      .segments {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      .segments button[aria-pressed='true'] {
        background: var(--surface);
        border-color: var(--blue);
        outline: 1px solid var(--blue);
        font-weight: 700;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3);
      }
      .choice-grid button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: start;
        min-width: 0;
        background: var(--surface);
      }
      .choice-grid button small {
        color: var(--text-soft);
        font-size: var(--text-small);
        line-height: 1.5;
      }
      .choice-grid button[aria-pressed='true'] {
        border-color: var(--action);
        outline: 2px solid var(--action);
        background: var(--action-soft);
      }
      .hud {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-5);
        align-items: flex-end;
        margin-bottom: var(--space-3);
      }
      .hud strong {
        display: block;
        font-size: var(--text-large);
        line-height: 1.15;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-item {
        position: relative;
        min-width: 0;
      }
      .score-pop {
        position: absolute;
        left: 0;
        top: -4px;
        color: var(--good);
        font-weight: 700;
        pointer-events: none;
        animation: score-pop var(--pop-duration) ease-out forwards;
      }
      @keyframes score-pop {
        from {
          transform: translateY(var(--pop-distance));
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .medals {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }
      .medals svg,
      .badge-list svg {
        width: var(--medal-size);
        height: var(--medal-size);
        color: var(--brass);
        flex: none;
      }
      .medal-earned circle {
        fill: var(--action-soft);
      }
      .badge-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .badge-list li {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        margin-bottom: var(--space-3);
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .steps li {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        margin-bottom: var(--space-3);
      }
      .steps svg {
        width: 56px;
        height: 56px;
        flex: none;
        color: var(--blue);
      }
      .toast {
        position: fixed;
        left: var(--space-4);
        right: var(--space-4);
        bottom: var(--space-4);
        max-width: 360px;
        margin: 0 auto;
        padding: var(--space-3);
        background: var(--blue-soft);
        border: 1px solid var(--blue);
        border-radius: var(--radius-control);
        color: var(--text);
        text-align: center;
        z-index: 10;
      }
      .notice {
        color: var(--text-soft);
        margin-bottom: var(--space-2);
      }
      .notice:empty,
      [data-slot]:empty {
        display: none;
      }
      .settings {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: var(--space-4);
        margin-top: var(--space-5);
      }
      .settings summary {
        font-weight: 700;
        cursor: pointer;
        min-height: var(--target-min);
        display: flex;
        align-items: center;
      }
      .settings label {
        display: block;
        margin-top: var(--space-3);
      }
      .settings input[type='range'] {
        width: 100%;
        accent-color: var(--action);
      }
      .check-result {
        margin-top: var(--space-3);
        padding: var(--space-3);
        background: var(--surface-2);
        border-radius: var(--radius-control);
      }
      .check-result ul {
        padding-inline-start: var(--space-5);
        margin: var(--space-2) 0;
      }
      .check-result .is-pass {
        color: var(--good);
        font-weight: 700;
      }
      .check-result .is-fail {
        color: var(--bad);
        font-weight: 700;
      }
      .result-score {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .result-rows > * {
        opacity: 0;
        transition: opacity var(--fade-duration);
        transition-delay: calc(var(--result-step) * var(--row, 0));
      }
      .result-rows.is-revealed > *,
      :root[data-reduce='true'] .result-rows > * {
        opacity: 1;
      }
      .stat-line {
        margin: var(--space-1) 0;
      }
      .new-best {
        color: var(--good);
        font-weight: 700;
      }
      footer {
        margin-top: var(--space-5);
        color: var(--text-soft);
        font-size: var(--text-small);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      progress {
        width: 100%;
        accent-color: var(--action);
      }
      :root[data-reduce='true'] *,
      :root[data-reduce='true'] *::after {
        animation: none !important;
        transition: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .result-rows > * {
          opacity: 1;
        }
      }
      /* สีของเกม */
      :root {
        --key-white: #ffffff; /* พื้นคีย์ขาว */
        --key-white-ink: #17252f; /* ตัวอักษรบนคีย์ขาว */
        --key-black: #17252f; /* พื้นคีย์ดำ */
        --key-black-ink: #ffffff; /* ตัวอักษรบนคีย์ดำ */
        --key-line: #b5c8d4; /* เส้นขอบคีย์ */
        --key-lit: #fdece7; /* พื้นคีย์ขาวที่กำลังสว่าง */
        --key-lit-black: #c4421f; /* พื้นคีย์ดำที่กำลังสว่าง */
        --key-lit-line: #c4421f; /* เส้นขอบคีย์ที่สว่าง */
        --key-right: #e1f2ea; /* พื้นคีย์ที่กดถูก */
        --key-wrong: #fbe6e4; /* พื้นคีย์ที่กดผิด */
        --dot-fill: #3f6f8d; /* สีจุดที่เล่นตามแล้ว */
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --key-white: #dfe9ef;
          --key-white-ink: #0f1a21;
          --key-black: #0b1318;
          --key-black-ink: #e6eef3;
          --key-line: #5f7584;
          --key-lit: #f6c9bb;
          --key-lit-black: #b8431f;
          --key-lit-line: #f07a5a;
          --key-right: #a9e0c3;
          --key-wrong: #f6b5ae;
          --dot-fill: #8cb8d3;
        }
      }
      :root[data-theme='dark'] {
        --key-white: #dfe9ef;
        --key-white-ink: #0f1a21;
        --key-black: #0b1318;
        --key-black-ink: #e6eef3;
        --key-line: #5f7584;
        --key-lit: #f6c9bb;
        --key-lit-black: #b8431f;
        --key-lit-line: #f07a5a;
        --key-right: #a9e0c3;
        --key-wrong: #f6b5ae;
        --dot-fill: #8cb8d3;
      }
      /* ขนาดและระยะ */
      :root {
        --key-height: 150px; /* ความสูงของคีย์ขาว (ค่าจริงตั้งจาก CONFIG.keyHeightPx) */
        --key-white-min: 36px; /* ความกว้างต่ำสุดของคีย์ขาว */
        --key-black-min: 26px; /* ความกว้างต่ำสุดของคีย์ดำ */
        --key-black-ratio: 0.675; /* ความกว้างของคีย์ดำเทียบกับคีย์ขาว */
        --dot-size: 14px; /* ขนาดจุดบอกความคืบหน้า */
      }
      .tune-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .tune-list button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: start;
        background: var(--surface);
      }
      .tune-list button small {
        color: var(--text-soft);
        font-size: var(--text-small);
      }
      .tune-list button[aria-pressed='true'] {
        border-color: var(--action);
        outline: 2px solid var(--action);
        background: var(--action-soft);
      }
      .tune-list svg {
        width: 20px;
        height: 20px;
        color: var(--brass);
        vertical-align: middle;
      }
      #earNotice {
        margin-top: var(--space-2);
      }
      .choice-grid button[aria-disabled='true'] {
        border-style: dashed;
      }
      .status {
        font-size: var(--text-medium);
        font-weight: 700;
        min-height: 1.6em;
        margin: var(--space-2) 0;
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        min-height: var(--dot-size);
        margin-bottom: var(--space-2);
      }
      .dot {
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: var(--radius-pill);
        border: 2px solid var(--dot-fill);
      }
      .dot.is-filled {
        background: var(--dot-fill);
      }
      .readout {
        font-size: 40px;
        font-weight: 700;
        text-align: center;
        line-height: 1.3;
        margin: var(--space-3) 0;
      }
      .hearts {
        display: inline-flex;
        gap: 2px;
        vertical-align: middle;
        margin-inline-end: var(--space-2);
      }
      .hearts svg {
        width: 18px;
        height: 18px;
        color: var(--bad);
      }
      .keyboard {
        position: relative;
        display: flex;
        height: var(--key-height);
        margin: var(--space-4) calc(-1 * var(--space-4));
        user-select: none;
        touch-action: manipulation;
      }
      @media (min-width: 480px) {
        .keyboard {
          margin-inline: 0;
        }
      }
      .key {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 0 0 var(--space-2);
        border: 1px solid var(--key-line);
        min-height: 88px;
        transition: background var(--fade-duration);
      }
      .key-white {
        flex: 1 1 0;
        min-width: var(--key-white-min);
        height: 100%;
        background: var(--key-white);
        color: var(--key-white-ink);
        border-radius: 0 0 8px 8px;
      }
      .key-black {
        position: absolute;
        top: 0;
        z-index: 2;
        height: 60%;
        width: calc(100% / 8 * var(--key-black-ratio));
        min-width: var(--key-black-min);
        left: calc(100% / 8 * (var(--after) + 1) - 100% / 8 * var(--key-black-ratio) / 2);
        background: var(--key-black);
        color: var(--key-black-ink);
        border-radius: 0 0 6px 6px;
      }
      .key-label {
        font-size: var(--text-small);
        font-weight: 700;
        line-height: 1.2;
        pointer-events: none;
      }
      .key-mark {
        min-height: 1.2em;
        font-size: var(--text-small);
        font-weight: 700;
        pointer-events: none;
      }
      .key.is-lit {
        background: var(--key-lit);
        border-color: var(--key-lit-line);
        box-shadow: inset 0 8px 0 var(--key-lit-line);
      }
      .key-black.is-lit {
        background: var(--key-lit-black);
      }
      .key.is-lit .key-mark::before {
        content: '●';
      }
      .key.is-down {
        transform: translateY(2px);
      }
      .key.is-right {
        background: var(--key-right);
        border-color: var(--good);
        box-shadow: inset 0 0 0 3px var(--good);
        color: var(--key-white-ink);
      }
      .key.is-right .key-mark::before {
        content: '✓';
      }
      .key.is-wrong {
        background: var(--key-wrong);
        border-color: var(--bad);
        box-shadow: inset 0 0 0 3px var(--bad);
        border-style: dashed;
        color: var(--key-white-ink);
      }
      .key.is-wrong .key-mark::before {
        content: '✗';
      }
      .key.is-off {
        opacity: 0.35;
        border-style: dotted;
        cursor: default;
      }
      .key.is-start {
        outline: 3px dashed var(--brass);
        outline-offset: -4px;
      }
      .key.is-start .key-mark::before {
        content: '▶';
      }
      .song-list {
        list-style: none;
        padding: 0;
        margin: 0 0 var(--space-4);
      }
      .song-list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        padding: var(--space-3);
        margin-bottom: var(--space-2);
      }
      .song-list .song-text {

      .retry-list {

      }
      .retry-list li {

        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-2);
      }

        };
        /* ═══════════ โซน B · ตั้งค่า (แก้ได้) ═══════════ */
        /* ตัวเลขที่ปรับได้ของเกม ชื่อทุกตัวบอกหน่วยไว้ท้ายชื่อ (Ms = มิลลิวินาที, Sec = วินาที, Bpm = จังหวะต่อนาที) */
        var CONFIG = {
          /* ค่ากลางที่ทุกเกมใช้ร่วมกัน */
          masterGain: 0.2, // ระดับเสียงรวมของเครื่องเสียง (ก่อนคูณระดับเสียงจากแถบเลื่อน)
          defaultVolumePercent: 25, // ระดับเสียงเริ่มต้น (0-100)
          audioAttackSec: 0.01, // เวลาไล่เสียงขึ้นของแต่ละตัว (วินาที)
          audioReleaseSec: 0.02, // เวลาไล่เสียงลงของแต่ละตัว (วินาที)
          toastMs: 2500, // เวลาที่ข้อความสั้น ๆ แสดงอยู่ (มิลลิวินาที)
          confirmMs: 3000, // เวลาที่ปุ่มยืนยันสองขั้นรออยู่ (มิลลิวินาที)
          popMs: 600, // เวลาก่อนลบตัวเลขคะแนนที่ลอยขึ้น (มิลลิวินาที)
          countUpMs: 600, // เวลานับคะแนนขึ้นในหน้าสรุป (มิลลิวินาที)
          seed: 0, // เมล็ดของตัวสุ่ม (0 = สุ่มใหม่ทุกครั้ง ใส่เลขอื่นเพื่อให้ได้ทำนองชุดเดิมซ้ำ)
          wave: 'triangle', // รูปคลื่นเสียงของคีย์บอร์ด (sine, triangle, square, sawtooth)
          growLives: 3, // ชีวิตของโหมดต่อทำนอง (ผิดได้กี่ครั้ง)
          growBpm: 100, // จังหวะเริ่มต้นของโหมดต่อทำนอง (จังหวะต่อนาที)
          growBpmStep: 4, // จังหวะที่เพิ่มขึ้นทุก 3 รอบ (จังหวะต่อนาที)
          growBpmMax: 140, // จังหวะสูงสุดของโหมดต่อทำนอง (จังหวะต่อนาที)
          growReplays: 1, // จำนวนครั้งที่กด "ฟังอีกครั้ง" ได้ในแต่ละรอบของโหมดต่อทำนอง
          pointsPerNote: 10, // คะแนนต่อโน้ตหนึ่งตัวที่เล่นตามถูกในโหมดต่อทำนอง
          cleanRoundBonus: 20, // โบนัสของรอบที่ไม่ผิดเลย คูณจำนวนรอบที่ไม่ผิดติดกัน (สูงสุด 5)
          blindPhrases: 8, // จำนวนท่อนในหนึ่งเกมของโหมดฟังอย่างเดียว
          blindReplays: 2, // จำนวนครั้งที่กด "ฟังอีกครั้ง" ได้ในแต่ละท่อนของโหมดฟังอย่างเดียว
          blindBpm: 90, // จังหวะของโหมดฟังอย่างเดียว (จังหวะต่อนาที)
          chunkPoints: [100, 50], // คะแนนของท่อนที่ผ่านในครั้งที่ 1 และครั้งที่ 2
          triesPerChunk: 2, // จำนวนครั้งที่ลองได้ในแต่ละท่อนของโหมดเรียนเพลงและฟังอย่างเดียว
          learnedRatio: 0.8, // สัดส่วนท่อนที่ต้องผ่านจึงนับว่าเรียนเพลงนั้นได้แล้ว
          maxLeapSemitones: 7, // ระยะกระโดดมากที่สุดระหว่างโน้ตสองตัวติดกัน (เสียงครึ่งขั้น)
          noteGapRatio: 0.9, // ส่วนของเวลาที่โน้ตแต่ละตัวส่งเสียงจริง (ที่เหลือเป็นช่องเว้น)
          litRatio: 0.7, // ส่วนของเวลาเสียงที่คีย์สว่างอยู่ (น้อยกว่า 1 เพื่อให้โน้ตซ้ำตัวเดิมเห็นเป็นแสงกะพริบแยกกัน)
          afterPlaybackMs: 300, // เวลาพักหลังเล่นทำนองจบ ก่อนถึงตาผู้เล่น (มิลลิวินาที)
          wrongPauseMs: 500, // เวลาพักหลังกดผิด ก่อนเล่นทำนองซ้ำ (มิลลิวินาที)
          slowFactor: 0.6, // ตัวคูณจังหวะตอนเฉลยท่อนที่ผ่านไม่ได้ (น้อยกว่า 1 คือช้าลง)
          keyFlashMs: 250, // เวลาที่คีย์แสดงว่าถูกหรือผิด (มิลลิวินาที)
          lookaheadMs: 100, // เวลาที่ตั้งเสียงล่วงหน้าตอนเล่นทำนอง (มิลลิวินาที)
          maxLateMs: 400, // ถ้าหน้าจอค้างเกินเวลานี้ จะข้ามโน้ตที่เลยเวลาไปแล้ว (มิลลิวินาที)
          keyHeightPx: 150 // ความสูงของคีย์ขาว (พิกเซล)
        };
        /* ═══════════ โซน C · แกนเกม (ห้ามแก้) ═══════════ */
        /* แกนเกม: ฟังก์ชันล้วน ไม่แตะหน้าจอ เสียง หรือที่เก็บข้อมูล ตัวสุ่มส่งเข้ามาจากข้างนอกเพื่อทดสอบซ้ำได้ */
        var Core = {};

        // สร้างตัวสุ่มที่ให้ผลซ้ำได้เมื่อใช้เมล็ดเดียวกัน (mulberry32) คืนฟังก์ชันที่ให้เลข 0 ถึงน้อยกว่า 1
        Core.makeRng = function (seed) {
          var state = seed >>> 0;
          return function () {
            state = (state + 0x6d2b79f5) >>> 0;
            var x = state;
            x = Math.imul(x ^ (x >>> 15), x | 1);
            x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
            return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
          };
        };

        // หาคีย์จากรหัส ถ้าไม่มีคืนค่าว่าง
        Core.keyById = function (id) {
          return (
            KEYS.filter(function (key) {
              return key.id === id;
            })[0] || null
          );
        };

        // แปลงเลขโน้ต MIDI เป็นความถี่ (เฮิรตซ์)
        Core.midiToHz = function (midi) {
          return 440 * Math.pow(2, (midi - 69) / 12);
        };

        // แปลงข้อความโน้ตของเพลง เช่น "C4:1 D4:0.5" เป็นรายการ { keyId, beats }
        Core.parseTune = function (notesStr) {
          return String(notesStr)
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .map(function (token) {
              var parts = token.split(':');
              return { keyId: parts[0], beats: parts.length > 1 ? Number(parts[1]) : NaN };
            });
        };

        // ตรวจเพลง คืนรายการปัญหา (ว่างคือใช้ได้): ไม่รู้จักคีย์ ความยาวโน้ตไม่ใช่เลขบวก หรือมีโน้ตน้อยกว่า 4 ตัว
        Core.validateTune = function (tune, keys) {
          var problems = [];
          tune.forEach(function (note) {
            if (!keys.some(function (key) { return key.id === note.keyId; })) {
              problems.push(fmt(TEXT.tuneUnknownKey, { id: note.keyId }));
            }
            if (!(note.beats > 0) || !isFinite(note.beats)) {
              problems.push(fmt(TEXT.tuneBadBeats, { token: note.keyId + ':' + note.beats }));
            }
          });
          if (tune.length < 4) problems.push(TEXT.tuneTooShort);
          return problems;
        };

        // เลือกโน้ตตัวถัดไปจากชุดคีย์ โดยไม่ซ้ำกันสามตัวติด
        // และกระโดดไม่เกิน maxLeapSemitones จากตัวก่อนหน้า (ถ้าชุดคีย์เอื้อ)
        Core.nextNote = function (sequence, poolIds, rng) {
          var candidates = poolIds.slice();
          var count = sequence.length;
          if (count >= 2 && sequence[count - 1] === sequence[count - 2]) {
            var repeated = sequence[count - 1];
            candidates = candidates.filter(function (id) {
              return id !== repeated;
            });
          }
          if (count >= 1) {
            var previous = Core.keyById(sequence[count - 1]).midi;
            var near = candidates.filter(function (id) {
              return Math.abs(Core.keyById(id).midi - previous) <= CONFIG.maxLeapSemitones;
            });
            if (near.length) candidates = near;
          }
          return candidates[Math.floor(rng() * candidates.length)];
        };

        // สร้างท่อนทำนองความยาว len จากชุดคีย์
        Core.makePhrase = function (len, poolIds, rng) {
          var phrase = [];
          for (var i = 0; i < len; i++) phrase.push(Core.nextNote(phrase, poolIds, rng));
          return phrase;
        };

        // แบ่งรายการเป็นกลุ่มละ size ตัว ถ้ากลุ่มสุดท้ายเหลือตัวเดียวให้รวมเข้ากับกลุ่มก่อนหน้า
        Core.chunks = function (items, size) {
          var groups = [];
          for (var i = 0; i < items.length; i += size) groups.push(items.slice(i, i + size));
          if (groups.length > 1 && groups[groups.length - 1].length === 1) {
            var last = groups.pop();
            groups[groups.length - 1] = groups[groups.length - 1].concat(last);
          }
          return groups;
        };

        // แปลงรายการโน้ต { keyId, beats } เป็นตารางเวลา: เริ่มเมื่อกี่มิลลิวินาที เสียงยาวกี่มิลลิวินาที และเวลารวม
        Core.schedule = function (items, bpm, gapRatio) {
          var beatMs = 60000 / bpm;
          var cursor = 0;
          var events = items.map(function (item) {
            var event = { keyId: item.keyId, atMs: cursor, durMs: item.beats * beatMs * gapRatio };
            cursor += item.beats * beatMs;
            return event;
          });
          return { events: events, totalMs: cursor };
        };

        // เริ่มตาของผู้เล่นสำหรับทำนองเป้าหมาย (รายการรหัสคีย์)
        Core.startTurn = function (target) {
          return { target: target.slice(), index: 0, mistakes: 0 };
        };

        // ผู้เล่นกดคีย์หนึ่งตัว คืนตาใหม่ (ไม่แก้ของเดิม) และผล 'progress' 'complete' หรือ 'wrong'
        // (กดผิดไม่ขยับตำแหน่ง)
        Core.press = function (turn, keyId) {
          if (keyId !== turn.target[turn.index]) {
            return {
              turn: { target: turn.target, index: turn.index, mistakes: turn.mistakes + 1 },
              outcome: 'wrong'
            };
          }
          var next = { target: turn.target, index: turn.index + 1, mistakes: turn.mistakes };
          return { turn: next, outcome: next.index >= turn.target.length ? 'complete' : 'progress' };
        };

        // จังหวะของรอบที่ round (เริ่มรอบที่ 1) เพิ่มทุก 3 รอบ และไม่เกินค่าสูงสุด
        Core.growTempo = function (round, config) {
          var steps = Math.floor((round - 1) / 3);
          return Math.min(config.growBpmMax, config.growBpm + steps * config.growBpmStep);
        };

        // คะแนนของรอบในโหมดต่อทำนอง: ความยาว × คะแนนต่อโน้ต + โบนัสรอบที่ไม่ผิด × จำนวนรอบที่ไม่ผิดติดกัน (สูงสุด 5)
        Core.growRoundScore = function (length, cleanStreak, config) {
          return length * config.pointsPerNote + config.cleanRoundBonus * Math.min(5, cleanStreak);
        };

        // คะแนนของท่อนที่ผ่านในครั้งที่ tryNumber (เริ่มที่ 1) เกินจำนวนครั้งที่ให้คืน 0
        Core.chunkScore = function (tryNumber, config) {
          return config.chunkPoints[tryNumber - 1] || 0;
        };

        // เรียนเพลงได้แล้วหรือไม่: results คือรายการเลขครั้งที่ผ่านของแต่ละท่อน (0 = ไม่ผ่าน)
        Core.tuneLearned = function (results, config) {
          if (!results.length) return false;
          var solved = results.filter(function (tries) {
            return tries > 0;
          }).length;
          return solved / results.length >= config.learnedRatio;
        };

        // ดาวของผลเกม: โหมดต่อทำนองดูความยาว โหมดอื่นดูท่อนที่ผ่าน (result.solved, result.total, result.firstTry)
        Core.stars = function (mode, result) {
          if (mode === 'grow') {
            if (result.length >= 10) return 3;
            return result.length >= 6 ? 2 : 1;
          }
          if (result.total > 0 && result.firstTry === result.total) return 3;
          return result.total > 0 && result.solved / result.total >= 0.7 ? 2 : 1;
        };

        // ผลใหม่ดีกว่าสถิติที่เก็บไว้หรือไม่ (ผล 0 คะแนนไม่นับเป็นสถิติใหม่)
        Core.isBetter = function (result, old) {
          if (!old || typeof old !== 'object') return result.score > 0;
          return result.score > old.score;
        };

        // กฎของเหรียญ: แต่ละกฎรับ (ตัวเลขของเหรียญ, ผลของเกมที่เพิ่งจบ, สถิติ, ข้อมูล) แล้วตอบว่าได้เหรียญหรือไม่
        Core.badgeRules = {
          roundsAtLeast: function (value, result, stats) {
            return stats.rounds >= value;
          },
          growLengthAtLeast: function (value, result) {
            return result.mode === 'grow' && result.length >= value;
          },
          tuneAllFirstTry: function (value, result) {
            return result.mode === 'tune' && result.total > 0 && result.firstTry === result.total;
          },
          blindSolvedAtLeast: function (value, result) {
            return result.mode === 'blind' && result.solved >= value;
          },
          learnedAtLeast: function (value, result, stats) {
            return stats.learned.length >= value;
          },
          learnedAll: function (value, result, stats, data) {
            return data.TUNES.every(function (tune) {
              return stats.learned.indexOf(tune.id) !== -1;
            });
          }
        };

        // เล่นเกมจำลองด้วยตัวสุ่มที่กำหนด คืนผลเหมือนเหตุการณ์ gameEnd (ใช้ในการตรวจระบบ ไม่ใช้กับเกมจริง)
        // level คือวัตถุระดับ (เหมือนในตาราง LEVELS) และ config คือชุดตัวเลขที่ใช้คิดคะแนน
        // grow: ผ่านทุกรอบจนถึงรอบที่ 6 แล้วผิดครบสามครั้ง · tune: ผ่านทุกท่อนยกเว้นท่อนแรกต้องลองสองครั้ง
        // blind: ผ่านทุกท่อนในครั้งแรก
        Core.scriptedGame = function (mode, level, seed, config, tuneNotes) {
          var pool = POOLS.filter(function (item) {
            return item.id === level.pool;
          })[0].keys;
          var rng = Core.makeRng(seed);
          var result = {
            mode: mode,
            level: level.id,
            tuneId: null,
            score: 0,
            stars: 1,
            length: 0,
            solved: 0,
            mistakes: 0
          };
          if (mode === 'grow') {
            var sequence = Core.makePhrase(level.growStartLen, pool, rng);
            var clean = 0;
            for (var round = 1; round <= 5; round++) {
              clean += 1;
              result.score += Core.growRoundScore(sequence.length, clean, config);
              result.length = sequence.length;
              result.solved += 1;
              sequence.push(Core.nextNote(sequence, pool, rng));
            }
            result.mistakes = config.growLives;
            result.stars = Core.stars('grow', result);
            return result;
          }
          var phrases;
          if (mode === 'tune') {
            phrases = Core.chunks(Core.parseTune(tuneNotes), level.chunkLen);
          } else {
            phrases = [];
            for (var i = 0; i < config.blindPhrases; i++) phrases.push(Core.makePhrase(level.phraseLen, pool, rng));
          }
          var tries = phrases.map(function (phrase, index) {
            return mode === 'tune' && index === 0 ? 2 : 1;
          });
          result.total = phrases.length;
          result.solved = tries.length;
          result.firstTry = tries.filter(function (n) {
            return n === 1;
          }).length;
          result.mistakes = tries.length - result.firstTry;
          tries.forEach(function (n) {
            result.score += Core.chunkScore(n, config);
          });
          result.stars = Core.stars(mode, result);
          return result;
        };

        /* ── ข้อสอบของปุ่ม "ตรวจระบบ": ทดสอบแกนเกมโดยไม่แตะสถานะของเกมที่กำลังเล่น ── */

        // เทียบค่าสองค่า ถ้าไม่เท่ากันให้หยุดพร้อมข้อความบอกว่าได้อะไรและควรได้อะไร
        function same(actual, expected, label) {
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            var detail = 'ได้ ' + JSON.stringify(actual) + ' ควรเป็น ' + JSON.stringify(expected);
            throw new Error((label ? label + ': ' : '') + detail);
          }
        }

        // ตรวจเงื่อนไข ถ้าไม่เป็นจริงให้หยุดพร้อมข้อความ
        function check(condition, label) {
          if (!condition) throw new Error(label);
        }

        // รหัสคีย์ทั้งหมดของชุดคีย์
        function poolKeys(poolId) {
          return POOLS.filter(function (pool) {
            return pool.id === poolId;
          })[0].keys;
        }

        // ตัวเลขตั้งต้นของสเปกสำหรับข้อสอบที่คิดคะแนนและจังหวะ ใช้ชุดนี้เสมอ
        // เพื่อให้การปรับตัวเลขในโซน B ไม่ทำให้ "ตรวจระบบ" ไม่ผ่านโดยไม่จำเป็น
        var SPEC_CONFIG = {
          growBpm: 100,
          growBpmStep: 4,
          growBpmMax: 140,
          pointsPerNote: 10,
          cleanRoundBonus: 20,
          chunkPoints: [100, 50],
          learnedRatio: 0.8,
          blindPhrases: 8,
          growLives: 3
        };

        // ระดับตัวอย่างสำหรับข้อสอบที่ต้องใช้ระดับ (ไม่ผูกกับตาราง LEVELS ที่นิสิตแก้ได้)
        var SPEC_LEVEL = { id: 'spec', pool: 'major', growStartLen: 2, phraseLen: 4, chunkLen: 3, tuneLevel: 1 };

        // ชุดข้อสอบแกนเกม แต่ละข้อมีชื่อภาษาไทยและฟังก์ชัน run ที่หยุดเมื่อไม่ผ่าน
        var CORE_TESTS = [

              function blind(solved) {
                return { mode: 'blind', solved: solved };
              }
              same([rules.blindSolvedAtLeast(6, blind(6)), rules.blindSolvedAtLeast(6, blind(5))], [true, false]);
              same([rules.learnedAtLeast(2, null, stats), rules.learnedAtLeast(3, null, stats)], [true, false]);

          {
            name: 'เกมจำลองครบทั้งสามโหมดและได้ผลซ้ำเดิม',
            run: function () {

              same(grow.solved, 5);
              same(grow, Core.scriptedGame('grow', SPEC_LEVEL, 3, SPEC_CONFIG));
              var mary = 'E4:1 D4:1 C4:1 D4:1 E4:1 E4:1 E4:2 D4:1 D4:1 D4:2 E4:1 G4:1 G4:2';
              var tune = Core.scriptedGame('tune', SPEC_LEVEL, 3, SPEC_CONFIG, mary);
              same(tune.total, 4);
              same(tune.firstTry, 3);
              same(tune.score, 100 + 50 + 100 + 100);
              var blind = Core.scriptedGame('blind', SPEC_LEVEL, 3, SPEC_CONFIG);
              same(blind.total, SPEC_CONFIG.blindPhrases);
              same(blind.score, SPEC_CONFIG.blindPhrases * 100);

          },
          {
            name: 'นับข้อมูลในตารางของเกม',
            run: function () {
              check(POOLS.length > 0 && LEVELS.length > 0 && MODES.length > 0, 'ตารางข้อมูลว่าง');
              LEVELS.forEach(function (level) {
                check(poolKeys(level.pool).length >= 3, 'ชุดคีย์ของระดับ ' + level.id + ' น้อยกว่า 3 ตัว');
              });
