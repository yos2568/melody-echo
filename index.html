          }
        ];
        /* ═══════════ โซน D · หน้าจอและเสียง (ห้ามแก้ถ้าไม่จำเป็น) ═══════════ */
        /* ── ส่วนกลางของหน้าจอ: ทุกเกมใช้ชุดฟังก์ชันนี้ร่วมกัน ── */
        var handlers = {};
        var errors = [];
        var warned = {};
        var memory = {};
        var storageOK = true;
        var activeScreen = 'home';
        var toastTimer = null;
        var confirmTimers = {};
        var audio = null;
        var master = null;
        var audioFailed = false;
        var stats = null;
        var settings = null;

        // คืนองค์ประกอบตามรหัสในหน้าเว็บ
        function byId(id) {
          return document.getElementById(id);
        }

        // ทำสำเนาข้อมูลธรรมดา (ตัวเลข ข้อความ รายการ) เพื่อไม่ให้แก้ของเดิมโดยไม่ตั้งใจ
        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        // แทนที่ {ชื่อ} ในข้อความด้วยค่าที่ให้มา
        function fmt(text, vars) {
          return String(text).replace(/\{(\w+)\}/g, function (all, name) {
            return vars && vars[name] !== undefined ? vars[name] : all;
          });
        }

        // ดึงข้อความภาษาไทยจากตาราง TEXT (ถ้าไม่มีรหัสนั้น คืนรหัสกลับไปให้เห็นว่าขาด)
        function t(key, vars) {
          return TEXT[key] === undefined ? key : fmt(TEXT[key], vars);
        }

        // สร้างองค์ประกอบ HTML พร้อมคุณสมบัติและลูก
        function el(tag, props, kids) {
          var node = document.createElement(tag);
          Object.keys(props || {}).forEach(function (name) {
            if (name === 'text') {
              node.textContent = props.text;
            } else if (name === 'on') {
              Object.keys(props.on).forEach(function (eventName) {
                node.addEventListener(eventName, props.on[eventName]);
              });
            } else {
              node.setAttribute(name, props[name]);
            }
          });
          (kids || []).forEach(function (kid) {
            if (kid) node.appendChild(kid);
          });
          return node;
        }

        // สร้างองค์ประกอบ SVG พร้อมคุณสมบัติและลูก
        function svg(tag, attrs, kids) {
          var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
          Object.keys(attrs || {}).forEach(function (name) {
            if (name === 'text') {
              node.textContent = attrs.text;
            } else {
              node.setAttribute(name, attrs[name]);
            }
          });
          (kids || []).forEach(function (kid) {
            if (kid) node.appendChild(kid);
          });
          return node;
        }

        // ใส่ข้อความภาษาไทยลงในองค์ประกอบที่มี data-t และ data-t-aria
        function applyText() {
          document.querySelectorAll('[data-t]').forEach(function (node) {
            node.textContent = t(node.getAttribute('data-t'));
          });
          document.querySelectorAll('[data-t-aria]').forEach(function (node) {
            node.setAttribute('aria-label', t(node.getAttribute('data-t-aria')));
          });
        }

        // อ่านค่าจากเบราว์เซอร์ ถ้าเก็บไม่ได้ใช้ค่าในหน่วยความจำแทน
        function read(key, fallback) {
          var raw = null;
          try {
            raw = localStorage.getItem(key);
          } catch (e) {
            storageOK = false;
            return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : fallback;
          }
          if (raw === null) return fallback;
          try {
            return JSON.parse(raw);
          } catch (e) {
            return fallback;
          }
        }

        // เก็บค่าในหน่วยความจำและในเบราว์เซอร์
        function write(key, value) {
          memory[key] = value;
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {
            storageOK = false;
          }
          showStorageNotice();
        }

        // แสดงข้อความครั้งเดียวเมื่อเบราว์เซอร์เก็บสถิติไม่ได้
        function showStorageNotice() {
          byId('notice').textContent = storageOK ? '' : t('storageNotice');
        }

        // ลงทะเบียนผู้รับเหตุการณ์ของเกม
        function on(name, handler) {
          (handlers[name] || (handlers[name] = [])).push(handler);
        }

        // ส่งเหตุการณ์ให้ผู้รับ ถ้าส่วนเสริมของนิสิตพังจะจดไว้และเกมเล่นต่อได้
        function emit(name, detail) {
          (handlers[name] || []).slice().forEach(function (handler) {
            try {
              handler(detail);
            } catch (e) {
              var message = String(e);
              errors.push(message);
              if (!warned[message]) {
                warned[message] = true;
                console.warn(message);
              }
              if (!byId('checkResult').hidden) showCheck();
            }
          });
        }

        // เปลี่ยนหน้าจอ ย้ายโฟกัสไปที่หัวเรื่อง และส่งเหตุการณ์ screenChange
        function showScreen(next) {
          var from = activeScreen;
          activeScreen = next;
          document.querySelectorAll('[data-screen]').forEach(function (screen) {
            screen.hidden = screen.getAttribute('data-screen') !== next;
          });
          var heading = document.querySelector('[data-screen="' + next + '"] h1');
          if (heading) heading.focus();
          if (from !== next) emit('screenChange', { from: from, to: next });
        }

        // แสดงข้อความสั้น ๆ ครั้งละหนึ่งข้อความ
        function showToast(message) {
          clearTimeout(toastTimer);
          var box = byId('toast');
          box.textContent = message;
          box.hidden = false;
          toastTimer = setTimeout(function () {
            box.hidden = true;
          }, CONFIG.toastMs);
        }

        // ปุ่มยืนยันสองขั้น: กดครั้งแรกเปลี่ยนข้อความ กดครั้งที่สองจึงทำจริง (ถ้า skip() เป็นจริงจะทำทันที)
        function twoStep(button, labelKey, confirmKey, action, skip) {
          button.addEventListener('click', function () {
            if (skip && skip()) {
              action();
              return;
            }
            if (confirmTimers[button.id]) {
              clearTimeout(confirmTimers[button.id]);
              delete confirmTimers[button.id];
              button.textContent = t(labelKey);
              action();
              return;
            }
            button.textContent = t(confirmKey);
            confirmTimers[button.id] = setTimeout(function () {
              delete confirmTimers[button.id];
              button.textContent = t(labelKey);
            }, CONFIG.confirmMs);
          });
        }

        // ปรับข้อมูลที่เก็บไว้ให้มีรูปแบบเดียวกับค่าเริ่มต้น ส่วนที่เสียหายใช้ค่าเริ่มต้นแทน
        function sanitize(stored, defaults) {
          var out = {};
          Object.keys(defaults).forEach(function (key) {
            var fallback = defaults[key];
            var value = stored && typeof stored === 'object' ? stored[key] : undefined;
            var isObject = fallback !== null && typeof fallback === 'object' && !Array.isArray(fallback);
            var fits = Array.isArray(fallback)
              ? Array.isArray(value)
              : isObject
                ? value !== null && typeof value === 'object' && !Array.isArray(value)
                : typeof value === typeof fallback;
            out[key] = fits ? value : clone(fallback);
          });
          return out;
        }

        // โหลดสถิติและการตั้งค่า ถ้าข้อมูลเสียหายใช้ค่าเริ่มต้น
        function loadAll() {
          stats = sanitize(read(STORE.stats, null), STATS_DEFAULT);
          stats.badges = stats.badges.filter(function (id) {
            return typeof id === 'string';
          });
          settings = sanitize(read(STORE.settings, null), SETTINGS_DEFAULT);
          settings.volume = Math.max(0, Math.min(100, Number(settings.volume) || 0));
          if (['auto', 'light', 'dark'].indexOf(settings.theme) === -1) settings.theme = 'auto';
        }

        // บันทึกสถิติ
        function saveStats() {
          write(STORE.stats, stats);
        }

        // บันทึกการตั้งค่า
        function saveSettings() {
          write(STORE.settings, settings);
        }

        // ใช้ธีมและการลดการเคลื่อนไหวตามที่ตั้งไว้
        function applyOptions() {
          var root = document.documentElement;
          if (settings.theme === 'light' || settings.theme === 'dark') {
            root.setAttribute('data-theme', settings.theme);
          } else {
            root.removeAttribute('data-theme');
          }
          root.setAttribute('data-reduce', settings.reduceMotion ? 'true' : 'false');
        }

        // ถามว่าควรลดการเคลื่อนไหวหรือไม่ (ตั้งในเกมหรือตั้งที่ระบบ)
        function motionReduced() {
          var system =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          return Boolean(settings.reduceMotion || system);
        }

        // เตรียมเครื่องเสียงหลังผู้เล่นแตะครั้งแรก ถ้าทำไม่ได้ เกมยังเล่นแบบไม่มีเสียงได้
        function initAudio() {
          if (audio) {
            if (audio.resume) audio.resume().catch(function () {});
            return;
          }
          var Context = window.AudioContext || window.webkitAudioContext;
          if (!Context || audioFailed) return;
          try {
            audio = new Context();
            master = audio.createGain();
            master.gain.value = CONFIG.masterGain;
            master.connect(audio.destination);
            if (audio.resume) audio.resume().catch(function () {});
          } catch (e) {
            audio = null;
            master = null;
            audioFailed = true;
          }
        }

        // ถามว่าเครื่องนี้เล่นเสียงได้หรือไม่
        function audioAvailable() {
          return Boolean(window.AudioContext || window.webkitAudioContext) && !audioFailed;
        }

        // เล่นเสียงหนึ่งตัวตามความถี่ ความยาว และเวลาเริ่ม (วินาทีนับจากตอนนี้)
        function playTone(hz, durSec, whenSec, wave) {
          if (!audio || !master) return;
          try {
            var level = settings.volume / 100;
            var start = audio.currentTime + (whenSec || 0);
            var attack = CONFIG.audioAttackSec;
            var release = Math.min(CONFIG.audioReleaseSec, durSec / 2);
            var osc = audio.createOscillator();
            var gain = audio.createGain();
            osc.type = wave || 'triangle';
            osc.frequency.value = hz;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(level, start + attack);
            gain.gain.setValueAtTime(level, start + Math.max(attack, durSec - release));
            gain.gain.linearRampToValueAtTime(0, start + durSec);
            osc.connect(gain);
            gain.connect(master);
            osc.start(start);
            osc.stop(start + durSec + 0.02);
          } catch (e) {
            /* เล่นเสียงไม่ได้ก็เล่นเกมต่อแบบเงียบ */
          }
        }

        // ทำให้เวลาเป็นข้อความ เช่น 1:05
        function formatTime(ms) {
          var total = Math.max(0, Math.round(ms / 1000));
          var minutes = Math.floor(total / 60);
          var seconds = total % 60;
          return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        // แสดงตัวเลขคะแนนที่ลอยขึ้นข้างค่าที่เปลี่ยน
        function popScore(anchor, delta) {
          if (!anchor || !delta || motionReduced()) return;
          var pop = el('span', { class: 'score-pop', 'aria-hidden': 'true', text: '+' + delta });
          anchor.appendChild(pop);
          setTimeout(function () {
            if (pop.parentNode) pop.parentNode.removeChild(pop);
          }, CONFIG.popMs);
        }

        // นับตัวเลขขึ้นจาก 0 ถึงค่าสุดท้าย ถ้าลดการเคลื่อนไหวให้แสดงค่าสุดท้ายทันที
        function countUp(node, value) {
          node.setAttribute('data-value', String(value));
          if (motionReduced() || value <= 0) {
            node.textContent = String(value);
            return;
          }
          var steps = 10;
          var step = 0;
          node.textContent = '0';
          var timer = setInterval(function () {
            step += 1;
            node.textContent = String(Math.round((value * step) / steps));
            if (step >= steps) clearInterval(timer);
          }, CONFIG.countUpMs / steps);
        }

        // ให้บรรทัดในหน้าสรุปค่อย ๆ ปรากฏตามลำดับ
        function revealRows(container) {
          Array.prototype.forEach.call(container.children, function (child, index) {
            child.style.setProperty('--row', index);
          });
          container.classList.remove('is-revealed');
          setTimeout(function () {
            container.classList.add('is-revealed');
          }, 20);
        }

        // วาดเหรียญหนึ่งเหรียญ เหรียญที่ได้แล้วมีพื้น เหรียญที่ยังไม่ได้เป็นเส้นประ
        function drawMedal(badge) {
          var earned = stats.badges.indexOf(badge.id) !== -1;
          var state = earned ? t('badgeHad') : t('badgeNot');
          var icon = svg(
            'svg',
            {
              viewBox: '0 0 32 32',
              role: 'img',
              class: earned ? 'medal-earned' : 'medal-open',
              'aria-label': badge.name + ' · ' + badge.hint + ' · ' + state
            },
            [
              svg('path', {
                d: 'M10 2l6 10l6-10',
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': 2,
                'stroke-linejoin': 'round'
              }),
              svg('circle', {
                cx: 16,
                cy: 20,
                r: 9,
                fill: 'none',
                stroke: 'currentColor',
                'stroke-width': 2,
                'stroke-dasharray': earned ? '0' : '3 3'
              }),
              earned
                ? svg('path', {
                    d: 'M11.5 20l3 3l6-6',
                    fill: 'none',
                    stroke: 'currentColor',
                    'stroke-width': 2,
                    'stroke-linecap': 'round'
                  })
                : null
            ]
          );
          icon.appendChild(svg('title', { text: badge.name + ' · ' + badge.hint }));
          return icon;
        }

        // วาดแถวเหรียญบนหน้าแรกและรายการเหรียญ
        function renderMedals() {
          var row = byId('homeBadges');
          row.textContent = '';
          BADGES.forEach(function (badge) {
            row.appendChild(drawMedal(badge));
          });
          var list = byId('badgeList');
          list.textContent = '';
          BADGES.forEach(function (badge) {
            var earned = stats.badges.indexOf(badge.id) !== -1;
            var text = el('div', {}, [
              el('strong', { text: badge.name }),
              el('div', { class: 'soft small', text: badge.hint + ' · ' + (earned ? t('badgeHad') : t('badgeNot')) })
            ]);
            list.appendChild(el('li', {}, [drawMedal(badge), text]));
          });
        }

        // ตรวจเหรียญหลังจบเกม แล้วแจ้งเหรียญใหม่ คืนรายการเหรียญใหม่
        function awardBadges(result) {
          var fresh = BADGES.filter(function (badge) {
            if (stats.badges.indexOf(badge.id) !== -1) return false;
            var rule = Core.badgeRules[badge.test];
            try {
              return Boolean(rule && rule(badge.value, result, stats, DATA));
            } catch (e) {
              return false;
            }
          });
          fresh.forEach(function (badge) {
            stats.badges.push(badge.id);
            emit('badgeEarned', { id: badge.id, name: badge.name });
          });
          if (fresh.length) {
            saveStats();
            renderMedals();
            showToast(
              fresh.length === 1 ? t('badgeToast', { name: fresh[0].name }) : t('badgeAllDone', { n: fresh.length })
            );
          }
          return fresh;
        }

        // วาดขั้นตอนวิธีเล่น แต่ละขั้นมีรูปเล็ก ๆ กับหนึ่งประโยค
        function renderHowto() {
          var list = byId('instructions');
          list.textContent = '';
          [1, 2, 3, 4].forEach(function (index) {
            list.appendChild(el('li', {}, [howtoIcon(index), el('span', { text: t('howto' + index) })]));
          });
        }

        // เปิดหน้าวิธีเล่น และจำไว้ว่าเคยเห็นแล้วเมื่อปิด
        function closeHowto() {
          if (!stats.seenHowto) {
            stats.seenHowto = true;
            saveStats();
          }
          showScreen('home');
        }

        // สรุปผลการตรวจระบบเป็น { passed, failed, results }
        function runSelfCheck() {
          var results = CORE_TESTS.map(function (test) {
            try {
              test.run();
              return { name: test.name, ok: true, detail: '' };
            } catch (e) {
              return { name: test.name, ok: false, detail: String(e && e.message ? e.message : e) };
            }
          });
          var failed = results.filter(function (item) {
            return !item.ok;
          }).length;
          return { passed: results.length - failed, failed: failed, results: results };
        }

        // แสดงผลตรวจระบบในหน้าเว็บ ใช้ข้อความ ผ่าน/ไม่ผ่าน ไม่ใช้สีอย่างเดียว
        function showCheck() {
          var report = runSelfCheck();
          var box = byId('checkResult');
          box.hidden = false;
          box.textContent = '';
          box.appendChild(
            el('p', {
              class: report.failed ? 'is-fail' : 'is-pass',
              text: report.failed
                ? '× ' + t('selfCheckFail', { k: report.failed })
                : '✓ ' + t('selfCheckPass', { n: report.passed, m: report.results.length })
            })
          );
          var list = el('ul');
          report.results.forEach(function (item) {
            var mark = item.ok ? t('markPass') : t('markFail');
            list.appendChild(el('li', { text: mark + ' · ' + item.name + (item.detail ? ' · ' + item.detail : '') }));
          });
          box.appendChild(list);
          box.appendChild(el('p', { class: 'small', text: countsLine() + ' · ' + storageLine() }));
          extraCheckLines().forEach(function (line) {
            box.appendChild(el('p', { class: 'small', text: line }));
          });
          errors.forEach(function (message) {
            box.appendChild(el('p', { class: 'is-fail', text: t('extensionLine', { error: message }) }));
          });
        }

        // บอกว่าเบราว์เซอร์เก็บสถิติได้หรือไม่
        function storageLine() {
          return storageOK ? t('storageOk') : t('storageBlocked');
        }

        // ผูกปุ่มและช่องตั้งค่าที่ทุกเกมมีเหมือนกัน
        function bindSharedControls() {
          byId('openHowto').addEventListener('click', function () {
            showScreen('howto');
          });
          byId('closeHowto').addEventListener('click', closeHowto);
          byId('openBadges').addEventListener('click', function () {
            showScreen('badges');
          });
          byId('closeBadges').addEventListener('click', function () {
            goTo('home');
          });
          byId('volume').value = settings.volume;
          byId('volume').addEventListener('input', function () {
            settings.volume = Number(this.value);
            saveSettings();
          });
          byId('testSound').addEventListener('click', function () {
            initAudio();
            playTone(440, 0.4, 0);
          });
          byId('theme').value = settings.theme;
          byId('theme').addEventListener('change', function () {
            settings.theme = this.value;
            applyOptions();
            saveSettings();
          });
          byId('reduce').checked = settings.reduceMotion;
          byId('reduce').addEventListener('change', function () {
            settings.reduceMotion = this.checked;
            applyOptions();
            saveSettings();
          });
          byId('check').addEventListener('click', showCheck);
          twoStep(byId('clearData'), 'btnClearData', 'btnClearDataConfirm', function () {
            [STORE.stats, STORE.settings].concat(STORE.extra || []).forEach(function (key) {
              delete memory[key];
              try {
                localStorage.removeItem(key);
              } catch (e) {
                storageOK = false;
              }
            });
            loadAll();
            applyOptions();
            renderMedals();
            resetAfterClear();
          });
        }
        /* ── ส่วนเฉพาะของเล่นตามทำนอง ── */
        var STORE = { stats: 'melody-echo-stats-v1', settings: 'melody-echo-settings-v1' };
        var STATS_DEFAULT = { best: {}, badges: [], learned: [], rounds: 0, seenHowto: false };
        var SETTINGS_DEFAULT = {
          volume: CONFIG.defaultVolumePercent,
          theme: 'auto',
          reduceMotion: false,
          mode: 'grow',
          level: 'easy',
          keyLabels: 'letters',
          wave: CONFIG.wave
        };
        var DATA = { KEYS: KEYS, POOLS: POOLS, LEVELS: LEVELS, MODES: MODES, TUNES: TUNES, BADGES: BADGES, TEXT: TEXT };
        var WAVES = ['sine', 'triangle', 'square', 'sawtooth'];
        var game = null;
        var lastResult = null;
        var chosenTuneId = null;
        var keyEls = {};
        var playback = null;
        var interrupted = null;
        var frameId = 0;
        var litTokens = {};
        var flowTimers = [];
        var flashTimers = [];

        // ข้อความเพิ่มเติมในหน้าตรวจระบบ: เพลงที่ใช้ไม่ได้และเหตุผล
        function extraCheckLines() {
          return TUNES.map(function (tune) {
            return { tune: tune, problems: Core.validateTune(Core.parseTune(tune.notes), KEYS) };
          })
            .filter(function (item) {
              return item.problems.length > 0;
            })
            .map(function (item) {
              return t('tuneSkipped', { id: item.tune.id, problem: item.problems.join(', ') });
            });
        }

        // ข้อความนับจำนวนข้อมูลในตารางของเกม สำหรับแสดงในหน้าตรวจระบบ
        function countsLine() {
          var perLevel = LEVELS.map(function (level) {
            return tunesOfLevel(level).length;
          }).join('/');
          return [
            t('cntKeys', { n: KEYS.length }),
            t('cntPools', { n: POOLS.length }),
            t('cntTunes', { n: validTunes().length }) + ' (' + perLevel + ')',
            t('cntModes', { n: MODES.length }),
            t('cntBadges', { n: BADGES.length }),
            t('cntScreens', { n: document.querySelectorAll('[data-screen]').length })
          ].join(' · ');
        }

        // รูปประกอบของแต่ละขั้นในหน้าวิธีเล่น
        function howtoIcon(index) {
          var line = { fill: 'none', stroke: 'currentColor', 'stroke-width': 2.4, 'stroke-linecap': 'round' };
          function shape(tag, attrs) {
            return svg(tag, Object.assign({}, line, attrs));
          }
          var parts = [
            [
              shape('rect', { x: 8, y: 16, width: 40, height: 28, rx: 3 }),
              svg('rect', { x: 18, y: 16, width: 8, height: 4, fill: 'currentColor' })
            ],
            [
              shape('path', { d: 'M14 40V20M28 40V12M42 40V26' }),
              svg('circle', { cx: 28, cy: 12, r: 4, fill: 'currentColor' })
            ],
            [shape('path', { d: 'M10 40h36M14 40V24M26 40V14M38 40V30' })],
            [shape('path', { d: 'M12 40V22M22 40V22M34 40V22M44 40V22' }), shape('path', { d: 'M8 14l10 4' })]
          ];
          return svg('svg', { viewBox: '0 0 56 56', 'aria-hidden': 'true' }, parts[index - 1]);
        }

        // เพลงที่ใช้ได้ (ผ่านการตรวจ) เพลงที่เสียจะถูกข้ามและไปรายงานในหน้าตรวจระบบ
        function validTunes() {
          return TUNES.filter(function (tune) {
            return Core.validateTune(Core.parseTune(tune.notes), KEYS).length === 0;
          });
        }

        // เพลงที่ใช้ได้ของระดับนั้น
        function tunesOfLevel(level) {
          return validTunes().filter(function (tune) {
            return tune.level === level.tuneLevel;
          });
        }

        // เลขลำดับของเพลงในตาราง TUNES (เริ่มที่ 1) ใช้ตั้งชื่อ "เพลงปริศนา"
        function tuneNumber(tune) {
          return TUNES.indexOf(tune) + 1;
        }

        // เพลงนี้เรียนได้แล้วหรือยัง
        function isLearned(tune) {
          return stats.learned.indexOf(tune.id) !== -1;
        }

        // ชื่อเพลงที่แสดงก่อนเรียน (ปริศนา) และหลังเรียน (ชื่อจริง)
        function tuneTitle(tune) {
          return isLearned(tune) ? tune.title : t('mysteryTune', { n: tuneNumber(tune) });
        }

        // ชุดคีย์ของระดับ (รายการรหัสคีย์)
        function poolOf(level) {
          return POOLS.filter(function (pool) {
            return pool.id === level.pool;
          })[0].keys;
        }

        // ระดับนี้ใช้ได้หรือไม่ (ชุดคีย์ต้องมีอย่างน้อย 3 ตัว)
        function levelUsable(level) {
          return poolOf(level).length >= 3;
        }

        // ระดับปัจจุบันที่เลือกบนหน้าแรก
        function currentLevel() {
          return (
            LEVELS.filter(function (level) {
              return level.id === settings.level;
            })[0] || LEVELS[0]
          );
        }

        // ตรวจว่าโหมดและระดับที่เก็บไว้ยังใช้ได้ ถ้าไม่ได้ใช้ค่าเริ่มต้น
        function validateChoices() {
          if (!MODES.some(function (mode) { return mode.id === settings.mode; })) settings.mode = 'grow';
          var usable = LEVELS.filter(levelUsable);
          if (!usable.some(function (level) { return level.id === settings.level; })) {
            settings.level = usable.length ? usable[0].id : LEVELS[0].id;
          }
          if (['none', 'letters', 'solfege'].indexOf(settings.keyLabels) === -1) settings.keyLabels = 'letters';
          if (WAVES.indexOf(settings.wave) === -1) settings.wave = CONFIG.wave;
          var tunes = tunesOfLevel(currentLevel());
          var stillThere = tunes.some(function (tune) {
            return tune.id === chosenTuneId;
          });
          if (!stillThere) {
            var fresh = tunes.filter(function (tune) {
              return !isLearned(tune);
            })[0];
            chosenTuneId = fresh ? fresh.id : tunes.length ? tunes[0].id : null;
          }
        }

        // ชื่อโน้ตสำหรับอ่านออกเสียง เช่น "C โด"
        function keyName(key) {
          return key.solfege ? key.letter + ' ' + key.solfege : key.letter;
        }

        // ข้อความบนคีย์ตามที่ตั้งไว้ (ไม่แสดง, ตัวอักษร หรือ โด เร มี)
        function keyLabelText(key) {
          if (settings.keyLabels === 'none') return '';
          if (settings.keyLabels === 'solfege') return key.solfege || key.letter;
          return key.letter;
        }

        // สร้างคีย์บอร์ด: คีย์ขาวเรียงแถว คีย์ดำวางทับตรงรอยต่อ
        function buildKeyboard() {
          var board = byId('keyboard');
          board.textContent = '';
          var whiteIndex = -1;
          KEYS.forEach(function (key) {
            if (!key.black) whiteIndex += 1;
            var button = el('button', {
              type: 'button',
              class: 'key ' + (key.black ? 'key-black' : 'key-white'),
              'data-key': key.id
            }, [el('span', { class: 'key-label' }), el('span', { class: 'key-mark', 'aria-hidden': 'true' })]);
            if (key.black) button.style.setProperty('--after', String(whiteIndex));
            button.setAttribute('aria-label', t('keyLabel', { name: keyName(key) }));
            button.addEventListener('pointerdown', function (event) {
              event.preventDefault();
              onKeyInput(key.id);
            });
            button.addEventListener('click', function (event) {
              if (event.detail === 0) onKeyInput(key.id);
            });
            keyEls[key.id] = button;
            board.appendChild(button);
          });
          board.style.setProperty('--key-height', CONFIG.keyHeightPx + 'px');
          relabelKeys();
        }

        // ใส่ข้อความบนคีย์ใหม่ตามการตั้งค่าชื่อบนคีย์
        function relabelKeys() {
          KEYS.forEach(function (key) {
            keyEls[key.id].querySelector('.key-label').textContent = keyLabelText(key);
          });
        }

        // เล่นเสียงของคีย์หนึ่งตัว (วินาทีเริ่มนับจากตอนนี้) ใช้รูปคลื่นที่ตั้งไว้
        function playKeyTone(keyId, durSec, whenSec) {
          playTone(Core.midiToHz(Core.keyById(keyId).midi), durSec, whenSec, settings.wave);
        }

        // เล่นเสียงของคีย์หนึ่งตัวทันที
        function playKey(keyId, durSec) {
          initAudio();
          playKeyTone(keyId, durSec || 0.4, 0);
        }

        // ทำให้คีย์สว่างเป็นเวลา ms มิลลิวินาที (ตัวนับป้องกันไม่ให้การดับครั้งเก่าดับครั้งใหม่)
        function lightKey(keyId, ms) {
          var node = keyEls[keyId];
          if (!node) return;
          litTokens[keyId] = (litTokens[keyId] || 0) + 1;
          var token = litTokens[keyId];
          node.classList.add('is-lit');
          setTimeout(function () {
            if (litTokens[keyId] === token) node.classList.remove('is-lit');
          }, ms);
        }

        // ล้างสถานะสว่างของทุกคีย์
        function clearLit() {
          KEYS.forEach(function (key) {
            litTokens[key.id] = (litTokens[key.id] || 0) + 1;
            keyEls[key.id].classList.remove('is-lit');
          });
        }

        // กะพริบสถานะของคีย์ชั่วครู่ (ถูก ผิด หรือกำลังกด)
        function flashKey(keyId, stateName, ms) {
          var node = keyEls[keyId];
          node.classList.add(stateName);
          flashTimers.push(
            setTimeout(function () {
              node.classList.remove(stateName);
            }, ms)
          );
        }

        // ล้างตัวจับเวลาที่ค้างอยู่ของลำดับเกมและการกะพริบ
        function clearFlow() {
          flowTimers.forEach(clearTimeout);
          flowTimers = [];
        }

        // เล่นรายการโน้ตตามเวลาจริง: ตั้งเสียงล่วงหน้าเล็กน้อย และอัปเดตหน้าจอเมื่อถึงเวลา
        // เวลาอ้างอิงคือ performance.now ไม่ใช่นาฬิกาเสียง ถ้าไม่มีเสียงก็ยังเดินครบ คืนเวลารวม (มิลลิวินาที)
        function startPlayback(items, bpm, lit, done) {
          if (playback) return 0;
          var plan = Core.schedule(items, bpm, CONFIG.noteGapRatio);
          if (document.hidden) {
            interrupted = { items: items, bpm: bpm, lit: lit, done: done };
            return plan.totalMs;
          }
          playback = { plan: plan, items: items, bpm: bpm, lit: lit, done: done };
          playback.startMs = performance.now();
          playback.soundNext = 0;
          playback.lightNext = 0;
          emit('playbackStart', { length: items.length, bpm: bpm, lit: lit });
          frameId = requestAnimationFrame(playbackFrame);
          return plan.totalMs;
        }

        // ทุกเฟรมของการเล่นทำนอง
        function playbackFrame() {
          if (!playback) return;
          var elapsed = performance.now() - playback.startMs;
          var events = playback.plan.events;
          // ข้ามโน้ตที่เลยเวลาไปมากเกินกำหนด (หน้าจอค้าง) โดยไม่เล่นเป็นชุดรัว
          function tooLate(event) {
            return event.atMs + CONFIG.maxLateMs < elapsed;
          }
          while (playback.soundNext < events.length && tooLate(events[playback.soundNext])) {
            playback.soundNext += 1;
          }
          while (playback.lightNext < events.length && tooLate(events[playback.lightNext])) {
            playback.lightNext += 1;
          }
          var due = [];
          var horizon = elapsed + CONFIG.lookaheadMs;
          while (playback.soundNext < events.length && events[playback.soundNext].atMs <= horizon) {
            due.push(events[playback.soundNext]);
            playback.soundNext += 1;
          }
          var late = due.filter(function (event) {
            return event.atMs < elapsed;
          });
          due.forEach(function (event) {
            if (late.length > 1 && event.atMs < elapsed && event !== late[late.length - 1]) return;
            playKeyTone(event.keyId, event.durMs / 1000, Math.max(0, (event.atMs - elapsed) / 1000));
          });
          while (playback.lightNext < events.length && events[playback.lightNext].atMs <= elapsed) {
            if (playback.lit) {
              var shown = events[playback.lightNext];
              lightKey(shown.keyId, shown.durMs * CONFIG.litRatio);
            }
            playback.lightNext += 1;
          }
          if (elapsed >= playback.plan.totalMs) {
            finishPlayback();
          } else {
            frameId = requestAnimationFrame(playbackFrame);
          }
        }

        // จบการเล่นทำนอง แล้วทำงานต่อที่ฝากไว้
        function finishPlayback() {
          var done = playback.done;
          var length = playback.items.length;
          playback = null;
          clearLit();
          emit('playbackEnd', { length: length });
          if (done) done();
        }

        // ยกเลิกการเล่นทำนองที่กำลังเล่นอยู่ (ไม่ทำงานต่อ)
        function cancelPlayback() {
          cancelAnimationFrame(frameId);
          playback = null;
          interrupted = null;
          clearLit();
        }

        // แสดงข้อความสถานะของตา (ฟังก่อน ถึงตาคุณ ...)
        function setStatus(key) {
          byId('status').textContent = key ? t(key) : '';
        }

        // วาดจุดบอกความคืบหน้า จุดละหนึ่งโน้ต
        function makeDots(count) {
          var box = byId('dots');
          box.textContent = '';
          for (var i = 0; i < count; i++) box.appendChild(el('span', { class: 'dot' }));
        }

        // ระบายจุดที่เล่นตามแล้ว
        function fillDot(index) {
          var dot = byId('dots').children[index];
          if (dot) dot.classList.add('is-filled');
        }

        // ขีดเส้นรอบคีย์แรกของท่อนในโหมดฟังอย่างเดียว
        function markStartKey() {
          KEYS.forEach(function (key) {
            keyEls[key.id].classList.remove('is-start');
          });
          if (game && game.mode === 'blind' && game.target.length) keyEls[game.target[0]].classList.add('is-start');
        }

        // ขีดจำกัดจำนวนครั้งที่ฟังซ้ำได้ของโหมดนี้ (ไม่จำกัดคือ null)
        function replayLimit() {
          if (!game) return null;
          if (game.mode === 'grow') return CONFIG.growReplays;
          if (game.mode === 'blind') return CONFIG.blindReplays;
          return null;
        }

        // ปรับปุ่มฟังอีกครั้งและข้อความจำนวนครั้งที่เหลือ
        function updateReplayUi() {
          var limit = replayLimit();
          var playing = Boolean(game && game.status === 'play' && !playback);
          var button = byId('replayBtn');
          button.hidden = !game || game.mode === 'free';
          button.disabled = !playing || (limit !== null && game.replaysLeft <= 0);
          byId('replaysLeft').textContent = limit !== null && game ? t('replaysLeft', { n: game.replaysLeft }) : '';
        }

        // ปรับตัวเลขบนแถบแสดงผลระหว่างเล่น
        function renderHud() {
          if (!game || game.mode === 'free') return;
          byId('hudScore').textContent = String(game.score);
          var lives = byId('hudLives');
          lives.textContent = '';
          if (game.mode === 'grow') {
            var hearts = el('span', { class: 'hearts', 'aria-hidden': 'true' });
            for (var i = 0; i < game.lives; i++) {
              var heart = 'M12 21C4 14 2 10 2 7a5 5 0 0 1 10-1a5 5 0 0 1 10 1c0 3-2 7-10 14z';
              var icon = svg('path', { d: heart, fill: 'currentColor' });
              hearts.appendChild(svg('svg', { viewBox: '0 0 24 24' }, [icon]));
            }
            lives.appendChild(hearts);
            lives.appendChild(document.createTextNode(t('hudLives', { n: game.lives })));
            byId('hudProgress').textContent = t('hudLength', { n: game.seq.length });
          } else {
            byId('hudProgress').textContent = t('phraseLabel', { i: game.phraseIndex + 1, n: game.phrases.length });
          }
          byId('hudLivesBox').hidden = game.mode !== 'grow';
        }

        // เริ่มช่วงฟัง: เล่นทำนองให้ฟัง แล้วถึงตาผู้เล่น (ผู้เล่นกดไม่ได้ระหว่างฟัง)
        function beginListen(items, bpm, lit, target) {
          game.status = 'listen';
          game.items = items;
          game.bpm = bpm;
          game.lit = lit;
          game.target = target;
          game.turn = null;
          setStatus('statusListen');
          makeDots(target.length);
          markStartKey();
          updateReplayUi();
          renderHud();
          startPlayback(items, bpm, lit, function () {
            flowTimers.push(
              setTimeout(function () {
                if (!game || game.status !== 'listen') return;
                game.turn = Core.startTurn(target);
                game.status = 'play';
                setStatus('statusPlay');
                updateReplayUi();
              }, CONFIG.afterPlaybackMs)
            );
          });
        }

        // รายการโน้ตจากรายการรหัสคีย์ (ทุกตัวยาวหนึ่งจังหวะ)
        function itemsOf(keyIds) {
          return keyIds.map(function (id) {
            return { keyId: id, beats: 1 };
          });
        }

        // ตั้งตัวจับเวลาของลำดับเกมที่ถูกล้างเมื่อออกจากเกม
        function later(fn, ms) {
          flowTimers.push(setTimeout(fn, ms));
        }

        // ผู้เล่นกดคีย์ (จากเมาส์ นิ้ว แป้นพิมพ์ หรือปุ่ม Enter)
        function onKeyInput(keyId) {
          initAudio();
          if (!game || activeScreen !== 'play') return;
          var key = Core.keyById(keyId);
          var node = keyEls[keyId];
          if (game.mode === 'free') {
            playKey(keyId, 0.5);
            flashKey(keyId, 'is-down', 120);
            byId('readout').textContent = t('lastNote', { solfege: key.solfege || key.letter, letter: key.letter });
            emit('notePress', { keyId: keyId, midi: key.midi, expected: null, correct: null, index: null });
            return;
          }
          if (playback || game.status !== 'play' || node.classList.contains('is-off')) return;
          flashKey(keyId, 'is-down', 100);
          var expected = game.turn.target[game.turn.index];
          var step = Core.press(game.turn, keyId);
          game.turn = step.turn;
          if (step.outcome === 'wrong') {
            playTone(110, 0.25, 0, 'square');
            flashKey(keyId, 'is-wrong', CONFIG.keyFlashMs);
            game.mistakes += 1;
            game.roundMistakes += 1;
            var wrongAt = game.turn.index;
            emit('notePress', { keyId: keyId, midi: key.midi, expected: expected, correct: false, index: wrongAt });
            onWrong();
            return;
          }
          var index = game.turn.index - 1;
          playKey(keyId, 0.35);
          fillDot(index);
          flashKey(keyId, 'is-right', CONFIG.keyFlashMs);
          emit('notePress', { keyId: keyId, midi: key.midi, expected: expected, correct: true, index: index });
          if (step.outcome === 'complete') onComplete();
        }

        // กดผิด: ตัดสินตามโหมด ว่าเสียชีวิต ลองใหม่ หรือเฉลยท่อน
        function onWrong() {
          game.status = 'busy';
          setStatus('wrongNote');
          updateReplayUi();
          if (game.mode === 'grow') {
            game.lives -= 1;
            emit('roundLost', { round: game.round, livesLeft: game.lives, triesLeft: null });
            renderHud();
            later(function () {
              if (game.lives <= 0) endGame('lives');
              else beginListen(game.items, game.bpm, true, game.target);
            }, CONFIG.wrongPauseMs);
            return;
          }
          game.tries += 1;
          var triesLeft = CONFIG.triesPerChunk - game.tries;
          emit('roundLost', { round: game.phraseIndex + 1, livesLeft: null, triesLeft: Math.max(0, triesLeft) });
          later(function () {
            if (triesLeft > 0) {
              beginListen(game.items, game.bpm, true, game.target);
            } else {
              game.results.push(0);
              game.status = 'shown';
              setStatus('statusShown');
              startPlayback(game.items, game.bpm * CONFIG.slowFactor, true, function () {
                later(nextPhrase, CONFIG.afterPlaybackMs);
              });
            }
          }, CONFIG.wrongPauseMs);
        }

        // เล่นตามครบหนึ่งรอบหรือหนึ่งท่อน: ให้คะแนนแล้วไปต่อ
        function onComplete() {
          game.status = 'busy';
          var points = 0;
          if (game.mode === 'grow') {
            game.cleanStreak = game.roundMistakes === 0 ? game.cleanStreak + 1 : 0;
            points = Core.growRoundScore(game.seq.length, game.cleanStreak, CONFIG);
            game.longest = Math.max(game.longest, game.seq.length);
            game.solved += 1;
            stats.rounds += 1;
            saveStats();
            emit('roundWon', {
              round: game.round,
              length: game.seq.length,
              points: points,
              mistakes: game.roundMistakes
            });
          } else {
            var tryNumber = game.tries + 1;
            points = Core.chunkScore(tryNumber, CONFIG);
            game.results.push(tryNumber);
            game.solved += 1;
            game.streak = tryNumber === 1 ? game.streak + 1 : 0;
            if (tryNumber === 1) game.firstTry += 1;
            emit('roundWon', {
              round: game.phraseIndex + 1,
              length: game.target.length,
              points: points,
              mistakes: game.tries
            });
          }
          game.score += points;
          var streak = game.mode === 'grow' ? game.cleanStreak : game.streak;
          emit('scoreChange', { score: game.score, delta: points, streak: streak });
          popScore(byId('hudScoreBox'), points);
          renderHud();
          setStatus('');
          later(function () {
            if (game.mode === 'grow') nextRound();
            else nextPhrase();
          }, CONFIG.keyFlashMs + 150);
        }

        // โหมดต่อทำนอง: เพิ่มโน้ตหนึ่งตัวแล้วเริ่มรอบใหม่
        function nextRound() {
          game.round += 1;
          game.roundMistakes = 0;
          game.replaysLeft = CONFIG.growReplays;
          game.seq.push(Core.nextNote(game.seq, game.pool, game.rng));
          beginListen(itemsOf(game.seq), Core.growTempo(game.round, CONFIG), true, game.seq.slice());
        }

        // โหมดเรียนเพลงและฟังอย่างเดียว: ไปท่อนถัดไป หรือจบถ้าครบแล้ว
        function nextPhrase() {
          if (!game || game.status === 'over') return;
          game.phraseIndex += 1;
          if (game.phraseIndex >= game.phrases.length) {
            finishPhrases();
            return;
          }
          startPhrase();
        }

        // เริ่มท่อนที่ game.phraseIndex
        function startPhrase() {
          var phrase = game.phrases[game.phraseIndex];
          game.tries = 0;
          game.replaysLeft = CONFIG.blindReplays;
          var bpm = game.mode === 'tune' ? game.tune.bpm : CONFIG.blindBpm;
          var items = phrase.map(function (item) {
            return { keyId: item.keyId, beats: item.beats };
          });
          var ids = items.map(function (item) {
            return item.keyId;
          });
          beginListen(items, bpm, game.mode !== 'blind', ids);
        }

        // ครบทุกท่อน: โหมดเรียนเพลงเผยชื่อเพลงและเล่นทั้งเพลง โหมดฟังอย่างเดียวจบเกม
        function finishPhrases() {
          if (game.mode !== 'tune') {
            endGame('done');
            return;
          }
          game.status = 'card';
          var tune = game.tune;
          var learned = Core.tuneLearned(game.results, CONFIG);
          game.learnedNow = learned;
          if (learned && !isLearned(tune)) {
            stats.learned.push(tune.id);
            saveStats();
            emit('tuneLearned', { tuneId: tune.id, title: tune.title });
          }
          byId('tuneCard').hidden = false;
          byId('tuneCardTitle').textContent = t('tuneCardTitle', { title: tune.title });
          byId('tuneCardBy').textContent = t('tuneCardBy', { by: tune.by });
          byId('tuneCardLine').textContent = learned ? t('tuneLearnedLine') : t('tuneNotYetLine');
          setStatus('');
          byId('nextBtn').hidden = false;
          byId('nextBtn').focus();
          startPlayback(Core.parseTune(tune.notes), tune.bpm, true, null);
          updateReplayUi();
        }

        // เปิดหน้าเล่นสำหรับโหมดและระดับที่เลือก
        function openPlay(mode, level) {
          cancelPlayback();
          clearFlow();
          game = {
            mode: mode,
            levelId: level.id,
            level: level,
            status: 'busy',
            score: 0,
            mistakes: 0,
            roundMistakes: 0,
            solved: 0,
            firstTry: 0,
            streak: 0,
            cleanStreak: 0,
            longest: 0,
            lives: CONFIG.growLives,
            round: 1,
            tries: 0,
            results: [],
            phraseIndex: 0,
            replaysLeft: 0,
            tune: null,
            phrases: []
          };
          var tunePool = POOLS.filter(function (item) {
            return item.id === 'major';
          })[0].keys;
          var pool = mode === 'tune' ? tunePool : poolOf(level);
          game.pool = pool;
          KEYS.forEach(function (key) {
            var off = mode !== 'free' && pool.indexOf(key.id) === -1;
            keyEls[key.id].classList.toggle('is-off', off);
            keyEls[key.id].classList.remove('is-start', 'is-right', 'is-wrong', 'is-down');
            if (off) keyEls[key.id].setAttribute('aria-disabled', 'true');
            else keyEls[key.id].removeAttribute('aria-disabled');
          });
          var free = mode === 'free';
          byId('playTitle').textContent = MODES.filter(function (item) {
            return item.id === mode;
          })[0].label;
          byId('hud').hidden = free;
          byId('status').hidden = free;
          byId('dots').hidden = free;
          byId('readout').hidden = !free;
          byId('readout').textContent = t('readoutNone');
          byId('tuneCard').hidden = true;
          byId('nextBtn').hidden = true;
          byId('replayBtn').hidden = free;
          byId('replaysLeft').textContent = '';
          setStatus('');
          byId('dots').textContent = '';
          showScreen('play');
        }

        // เริ่มเกมใหม่ตามโหมด ระดับ และเพลงที่เลือก
        function newGame(mode, levelId, tuneId) {
          initAudio();
          var level = LEVELS.filter(function (item) {
            return item.id === levelId;
          })[0] || LEVELS[0];
          openPlay(mode, level);
          game.rng = Core.makeRng(CONFIG.seed || Date.now());
          if (mode === 'free') {
            game.status = 'play';
            emit('gameStart', { mode: mode, level: level.id, tuneId: null });
            return;
          }
          if (mode === 'grow') {
            game.seq = Core.makePhrase(level.growStartLen, game.pool, game.rng);
            game.replaysLeft = CONFIG.growReplays;
          } else if (mode === 'tune') {
            game.tune = TUNES.filter(function (tune) {
              return tune.id === tuneId;
            })[0];
            game.phrases = Core.chunks(Core.parseTune(game.tune.notes), level.chunkLen);
          } else {
            for (var i = 0; i < CONFIG.blindPhrases; i++) {
              var phrase = Core.makePhrase(level.phraseLen, game.pool, game.rng);
              game.phrases.push(itemsOf(phrase));
            }
          }
          emit('gameStart', { mode: mode, level: level.id, tuneId: game.tune ? game.tune.id : null });
          renderHud();
          if (mode === 'grow') {
            beginListen(itemsOf(game.seq), Core.growTempo(1, CONFIG), true, game.seq.slice());
          } else {
            startPhrase();
          }
        }

        // จบเกม: คำนวณผล บันทึกสถิติ ให้เหรียญ แจ้งเหตุการณ์ และแสดงหน้าสรุป
        function endGame(reason) {
          if (!game || game.status === 'over' || game.mode === 'free') return;
          game.status = 'over';
          cancelPlayback();
          clearFlow();
          var total = game.phrases.length;
          var result = {
            mode: game.mode,
            level: game.levelId,
            tuneId: game.tune ? game.tune.id : null,
            score: game.score,
            stars: 0,
            length: game.longest,
            solved: game.solved,
            total: total,
            firstTry: game.firstTry,
            mistakes: game.mistakes
          };
          result.stars = Core.stars(game.mode, result);
          var bestKey = game.mode === 'tune' ? 'tune:' + result.tuneId : game.mode + ':' + game.levelId;
          var newBest = Core.isBetter(result, stats.best[bestKey]);
          if (newBest) {
            var entry = { score: result.score };
            if (game.mode === 'grow') entry.length = result.length;
            if (game.mode === 'blind') entry.solved = result.solved;
            stats.best[bestKey] = entry;
          }
          saveStats();
          awardBadges(result);
          lastResult = { result: result, reason: reason, newBest: newBest, learned: game.learnedNow, game: game };
          emit('gameEnd', result);
          renderResult();
          showScreen('result');
        }

        // ดาวเป็นข้อความ ไม่ใช้สีหรือรูปอย่างเดียว
        function starsText(count) {
          return count >= 3 ? TEXT.stars3 : count === 2 ? TEXT.stars2 : TEXT.stars1;
        }

        // วาดหน้าสรุปผลของเกมที่เพิ่งจบ
        function renderResult() {
          var info = lastResult;
          var result = info.result;
          var headings = { grow: TEXT.resultGrow, tune: TEXT.resultTune, blind: TEXT.resultBlind };
          byId('resultHeading').textContent = headings[result.mode];
          var body = byId('resultBody');
          body.textContent = '';
          var scoreLine = el('p', { class: 'result-score', id: 'resultScore' });
          body.appendChild(scoreLine);
          function statLine(text) {
            body.appendChild(el('p', { class: 'stat-line', text: text }));
          }
          statLine(t('statStars', { stars: starsText(result.stars) }));
          if (result.mode === 'grow') statLine(t('statLength', { n: result.length }));
          else statLine(t('statPhrases', { n: result.solved, m: result.total }));
          statLine(t('statMistakes', { n: result.mistakes }));
          if (info.newBest) body.appendChild(el('p', { class: 'new-best', text: TEXT.newBest }));
          if (result.mode === 'tune') {
            var tune = info.game.tune;
            body.appendChild(el('h2', { text: t('tuneCardTitle', { title: tune.title }) }));
            body.appendChild(el('p', { class: 'soft', text: t('tuneCardBy', { by: tune.by }) }));
            body.appendChild(el('p', { text: info.learned ? t('tuneLearnedLine') : t('tuneNotYetLine') }));
          }
          body.appendChild(el('h2', { text: TEXT.nextTitle }));
          if (result.mode === 'grow') {
            body.appendChild(el('p', { text: t('nextGrow', { n: result.length }) }));
          } else if (result.mode === 'blind') {
            body.appendChild(el('p', { text: TEXT.nextBlind }));
          } else {
            var retries = info.game.phrases
              .map(function (phrase, index) {
                return { phrase: phrase, index: index, tries: info.game.results[index] };
              })
              .filter(function (item) {
                return item.tries !== 1;
              });
            if (!retries.length) {
              body.appendChild(el('p', { text: TEXT.nextTuneClean }));
            } else {
              body.appendChild(el('p', { text: TEXT.nextTuneRetry }));
              var list = el('ul', { class: 'retry-list' });
              retries.forEach(function (item) {
                var listen = el('button', { type: 'button', text: TEXT.btnListen });
                listen.addEventListener('click', function () {
                  listenTo(item.phrase, info.game.tune.bpm);
                });
                var label = t('phraseLabel', { i: item.index + 1, n: info.game.phrases.length });
                list.appendChild(el('li', {}, [el('span', { text: label }), listen]));
              });
              body.appendChild(list);
            }
          }
          countUp(scoreLine, result.score);
          revealRows(body);
        }

        // ฟังรายการโน้ตโดยไม่ผูกกับเกม (ใช้ในสมุดเพลงและหน้าสรุป) ถ้าไม่มีเสียงจะแจ้งให้ทราบ
        function listenTo(items, bpm) {
          initAudio();
          if (!audio) {
            showToast(TEXT.audioNeeded);
            return;
          }
          startPlayback(items, bpm, false, null);
        }

        // สร้างข้อความสถิติที่ดีที่สุดของโหมดและระดับที่เลือกบนหน้าแรก
        function bestText() {
          if (settings.mode === 'free') return '';
          var key = settings.mode === 'tune' ? 'tune:' + chosenTuneId : settings.mode + ':' + settings.level;
          var best = stats.best[key];
          if (!best || typeof best !== 'object') return TEXT.bestNone;
          var value = String(best.score);
          if (settings.mode === 'grow') value += ' · ' + t('statLength', { n: best.length });
          return t('bestLine', { value: value });
        }

        // วาดหน้าแรก: โหมด ระดับ เพลง สถิติ และเหรียญ
        function renderHome() {
          validateChoices();
          var audioOk = audioAvailable();
          var modes = byId('modes');
          modes.textContent = '';
          MODES.forEach(function (mode) {
            var blocked = mode.needsSound && !audioOk;
            var pressed = mode.id === settings.mode ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed }, [
              el('strong', { text: mode.label }),
              el('small', { text: mode.about })
            ]);
            if (blocked) button.setAttribute('aria-disabled', 'true');
            button.addEventListener('click', function () {
              if (blocked) {
                byId('earNotice').textContent = TEXT.audioNeeded;
                return;
              }
              byId('earNotice').textContent = '';
              settings.mode = mode.id;
              saveSettings();
              renderHome();
            });
            modes.appendChild(button);
          });
          var levels = byId('levels');
          levels.textContent = '';
          LEVELS.filter(levelUsable).forEach(function (level) {
            var pressed = level.id === settings.level ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed, text: level.label });
            button.addEventListener('click', function () {
              settings.level = level.id;
              saveSettings();
              renderHome();
            });
            levels.appendChild(button);
          });
          byId('levelBlock').hidden = settings.mode === 'free';
          renderTunePicker();
          byId('homeBest').textContent = bestText();
          byId('learnedLine').textContent = t('learnedLine', { n: stats.learned.length, m: validTunes().length });
          var labels = byId('labelModes');
          labels.textContent = '';
          var labelChoices = [
            ['none', 'keyLabelsNone'],
            ['letters', 'keyLabelsLetters'],
            ['solfege', 'keyLabelsSolfege']
          ];
          labelChoices.forEach(function (pair) {
            var pressed = settings.keyLabels === pair[0] ? 'true' : 'false';
            var button = el('button', { type: 'button', 'aria-pressed': pressed, text: TEXT[pair[1]] });
            button.addEventListener('click', function () {
              settings.keyLabels = pair[0];
              saveSettings();
              relabelKeys();
              renderHome();
            });
            labels.appendChild(button);
          });
          renderMedals();
        }

        // วาดรายการเพลงของระดับที่เลือก (เพลงที่ยังไม่เรียนแสดงเป็นเพลงปริศนา)
        function renderTunePicker() {
          byId('tuneBlock').hidden = settings.mode !== 'tune';
          var list = byId('tunes');
          list.textContent = '';
          tunesOfLevel(currentLevel()).forEach(function (tune) {
            var learned = isLearned(tune);
            var pressed = tune.id === chosenTuneId ? 'true' : 'false';
            var kids = [el('strong', { text: tuneTitle(tune) })];
            if (learned) kids.push(el('small', { text: tune.by + ' · ' + t('learnedMark') }));
            var button = el('button', { type: 'button', 'aria-pressed': pressed }, kids);
            var title = button.querySelector('strong');
            if (learned) title.insertBefore(drawMedalIcon(), title.firstChild);
            button.addEventListener('click', function () {
              chosenTuneId = tune.id;
              renderHome();
            });
            list.appendChild(button);
          });
        }

        // เหรียญเล็ก ๆ หน้าชื่อเพลงที่เรียนแล้ว
        function drawMedalIcon() {
          return svg('svg', { viewBox: '0 0 32 32', 'aria-hidden': 'true' }, [
            svg('path', { d: 'M10 2l6 10l6-10', fill: 'none', stroke: 'currentColor', 'stroke-width': 2 }),
            svg('circle', { cx: 16, cy: 20, r: 9, fill: 'none', stroke: 'currentColor', 'stroke-width': 2 })
          ]);
        }

        // วาดรายการเพลงในสมุดเพลง
        function renderSongbook() {
          var list = byId('songList');
          list.textContent = '';
          validTunes().forEach(function (tune) {
            var text = el('div', { class: 'song-text' }, [el('strong', { text: tuneTitle(tune) })]);
            var kids = [text];
            if (isLearned(tune)) {
              text.appendChild(el('div', { class: 'soft small', text: tune.by }));
              var listen = el('button', { type: 'button', text: TEXT.btnListen });
              listen.addEventListener('click', function () {
                listenTo(Core.parseTune(tune.notes), tune.bpm);
              });
              kids.push(listen);
            }
            list.appendChild(el('li', {}, kids));
          });
        }

        // กลับหน้าแรก และหยุดทุกอย่างที่ค้างอยู่
        function returnHome() {
          cancelPlayback();
          clearFlow();
          game = null;
          renderHome();
          showScreen('home');
        }

        // ไปหน้าที่ระบุ (ใช้ได้เฉพาะหน้าที่เปิดได้ในขณะนั้น) คืนค่าจริงถ้าสำเร็จ
        function goTo(name) {
          if (name === 'home') {
            returnHome();
            return true;
          }
          if (name === 'howto' || name === 'badges') {
            showScreen(name);
            return true;
          }
          if (name === 'songbook') {
            renderSongbook();
            showScreen(name);
            return true;
          }
          if ((name === 'play' && game) || (name === 'result' && lastResult)) {
            showScreen(name);
            return true;
          }
          return false;
        }

        // ล้างข้อมูลเสร็จแล้ว ให้หน้าจอกลับไปเป็นค่าเริ่มต้น
        function resetAfterClear() {
          byId('volume').value = settings.volume;
          byId('theme').value = settings.theme;
          byId('reduce').checked = settings.reduceMotion;
          lastResult = null;
          chosenTuneId = null;
          relabelKeys();
          renderHome();
        }

        // ฟังอีกครั้งตามขีดจำกัดของโหมด คืนค่าจริงถ้าเริ่มฟังได้
        function replay() {
          if (!game || game.status !== 'play' || playback) return false;
          var limit = replayLimit();
          if (limit !== null && game.replaysLeft <= 0) return false;
          if (limit !== null) game.replaysLeft -= 1;
          beginListen(game.items, game.bpm, game.lit, game.target);
          return true;
        }

        // เล่นลำดับคีย์ที่ให้มา (ทุกตัวยาวหนึ่งจังหวะ) คืนเวลารวม ถ้ากำลังเล่นอยู่ไม่ทำอะไรและคืน 0
        function playSequence(keyIds, bpm, lit) {
          initAudio();
          var valid = keyIds.filter(function (id) {
            return Core.keyById(id);
          });
          if (!valid.length) return 0;
          return startPlayback(itemsOf(valid), bpm || CONFIG.growBpm, lit !== false, null);
        }

        // สำเนาสถานะปัจจุบันของเกม (อ่านอย่างเดียว)
        function getState() {
          var view = { screen: activeScreen, playing: Boolean(playback) };
          if (game) {
            view.mode = game.mode;
            view.level = game.levelId;
            view.tuneId = game.tune ? game.tune.id : null;
            view.status = game.status;
            view.score = game.score;
            view.lives = game.lives;
            view.round = game.round;
            view.length = game.seq ? game.seq.length : null;
            view.phraseIndex = game.phraseIndex;
            view.phraseCount = game.phrases.length;
            view.tries = game.tries;
            view.replaysLeft = game.replaysLeft;
            view.index = game.turn ? game.turn.index : 0;
            view.mistakes = game.mistakes;
          }
          return view;
        }

        // ผูกปุ่มทั้งหมดของเกม
        function bindControls() {
          bindSharedControls();
          byId('startPlay').addEventListener('click', function () {
            initAudio();
            var mode = MODES.filter(function (item) {
              return item.id === settings.mode;
            })[0];
            if (mode.needsSound && !audio) {
              byId('earNotice').textContent = TEXT.audioNeeded;
              return;
            }
            byId('earNotice').textContent = '';
            if (mode.id === 'tune' && !chosenTuneId) return;
            newGame(settings.mode, settings.level, chosenTuneId);
          });
          byId('randomTune').addEventListener('click', function () {
            var tunes = tunesOfLevel(currentLevel());
            var fresh = tunes.filter(function (tune) {
              return !isLearned(tune);
            });
            var from = fresh.length ? fresh : tunes;
            if (!from.length) return;
            var rng = Core.makeRng(CONFIG.seed || Date.now());
            chosenTuneId = from[Math.floor(rng() * from.length)].id;
            renderHome();
          });
          byId('openSongbook').addEventListener('click', function () {
            goTo('songbook');
          });
          byId('closeSongbook').addEventListener('click', returnHome);
          byId('replayBtn').addEventListener('click', replay);
          byId('nextBtn').addEventListener('click', function () {
            endGame('done');
          });
          twoStep(byId('quitBtn'), 'btnQuit', 'btnQuitConfirm', returnHome, function () {
            return !game || game.mode === 'free' || game.status === 'over' || game.status === 'card';
          });
          byId('againBtn').addEventListener('click', function () {
            if (lastResult) newGame(lastResult.result.mode, lastResult.result.level, lastResult.result.tuneId);
          });
          byId('homeBtn').addEventListener('click', returnHome);
          document.addEventListener('keydown', function (event) {
            if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || activeScreen !== 'play') return;
            var target = event.target;
            var tag = target && target.tagName ? target.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
            var name = String(event.key).toLowerCase();
            var key = KEYS.filter(function (item) {
              return item.key === name;
            })[0];
            if (key) {
              event.preventDefault();
              onKeyInput(key.id);
            }
          });
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
              if (playback) {
                interrupted = { items: playback.items, bpm: playback.bpm, lit: playback.lit, done: playback.done };
                cancelAnimationFrame(frameId);
                playback = null;
                clearLit();
              }
            } else if (interrupted) {
              var again = interrupted;
              interrupted = null;
              startPlayback(again.items, again.bpm, again.lit, again.done);
            }
          });
        }

        window.Game = {
          on: on,
          getState: getState,
          getStats: function () {
            return clone(stats);
          },
          CONFIG: CONFIG,
          DATA: DATA,
          Core: Core,
          runSelfCheck: runSelfCheck,
          playTone: playTone,
          showToast: showToast,
          goTo: goTo,
          playKey: playKey,
          playSequence: playSequence,
          getSequence: function () {
            return game && game.target ? game.target.slice() : [];
          },
          replay: replay,
          highlightKey: function (keyId, ms) {
            if (Core.keyById(keyId)) lightKey(keyId, ms || 400);
          },
          setWave: function (type) {
            if (WAVES.indexOf(type) === -1) return false;
            settings.wave = type;
            saveSettings();
            return true;
          },
          addLife: function () {
            if (!game || game.mode !== 'grow' || game.status === 'over' || game.lives >= CONFIG.growLives) return false;
            game.lives += 1;
            renderHud();
            return true;
          }
        };

        // เริ่มทำงานเมื่อโหลดหน้า
        loadAll();
        applyOptions();
        applyText();
        buildKeyboard();
        bindControls();
        renderHowto();
        renderHome();
        showStorageNotice();
        if (new URLSearchParams(location.search).get('selfcheck') === '1') {
          byId('settings').open = true;
          showCheck();
        } else if (!stats.seenHowto) {
          showScreen('howto');
        }
        /* ═══════════ โซน E · ส่วนเสริมของนิสิต (เขียนเพิ่มที่นี่) ═══════════ */
        /* วิธีใช้โซนนี้: เขียนส่วนเสริมของคุณที่นี่ โดยฟังเหตุการณ์ด้วย Game.on(ชื่อเหตุการณ์, ฟังก์ชัน)
           และเรียกตัวช่วยของ Game เช่น Game.getSequence, Game.playSequence, Game.showToast
           วางปุ่มหรือข้อความของคุณในช่องว่าง slotHome, slotHud, slotActions, slotPanel, slotResult ได้เลย
           ห้ามแก้โซน C ถ้าส่วนเสริมพัง เกมจะเล่นต่อได้ และข้อความผิดพลาดจะไปแสดงที่ปุ่ม "ตรวจระบบ" */
        /* เพิ่มส่วนเสริมที่นี่ */
        /* ตัวอย่าง (ลบเครื่องหมายคอมเมนต์ออกเพื่อใช้): แสดงข้อความทุกครั้งที่กดคีย์ผิด
        Game.on('notePress', function (detail) {
          if (detail.correct === false) Game.showToast('ผิดที่ตัวที่ ' + (detail.index + 1));
        });
        */
      }());
    </script>
  </body>
</html>
